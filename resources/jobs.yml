# Databricks Workflow definition. No cluster/job_cluster block is defined
# on any task, so tasks run on serverless compute -- required on Free
# Edition, and generally the simplest option since there's no cluster
# sizing to manage.

resources:
  jobs:
    retail_lakehouse_pipeline:
      name: retail-lakehouse-pipeline
      description: >
        Bronze -> Silver -> Gold retail data pipeline. Ingests TPC-DS
        sample tables plus a simulated live order feed, cleans and joins
        into silver, and produces gold business aggregates.

      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: landing_path
          default: ${var.landing_path}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - faker
              - pandas

      tasks:
        - task_key: simulate_live_orders
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/stream_simulator.py
            parameters: ["{{job.parameters.landing_path}}", "50"]

        - task_key: bronze_batch_ingest
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/bronze_ingest.py
            parameters: ["{{job.parameters.catalog_name}}"]

        - task_key: bronze_stream_orders
          environment_key: default
          depends_on:
            - task_key: simulate_live_orders
          spark_python_task:
            python_file: ../src/ingestion/bronze_stream_orders.py
            parameters: ["{{job.parameters.catalog_name}}", "{{job.parameters.landing_path}}"]

        - task_key: silver_transform
          environment_key: default
          depends_on:
            - task_key: bronze_batch_ingest
            - task_key: bronze_stream_orders
          spark_python_task:
            python_file: ../src/transform/silver_transform.py
            parameters: ["{{job.parameters.catalog_name}}"]

        - task_key: gold_transform
          environment_key: default
          depends_on:
            - task_key: silver_transform
          spark_python_task:
            python_file: ../src/transform/gold_transform.py
            parameters: ["{{job.parameters.catalog_name}}"]

      email_notifications:
        on_failure:
          - your-email@example.com